[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hospital-management"
version = "1.0.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.109.1",
    "uvicorn[standard]==0.24.0",
    "sqlalchemy==2.0.23",
    "alembic==1.12.1",
    "jinja2==3.1.2",
    "python-multipart==0.0.30",
    "python-jose[cryptography]==3.4.0",
    "passlib[bcrypt]==1.7.4",
    "pydantic[email]==2.5.0",
    "pydantic-settings==2.1.0",
    "aiofiles==23.2.1",
    "httpx==0.25.2",
    "python-dotenv==1.0.0",
    "reportlab==4.0.7",
    "openpyxl==3.1.2",
    "pillow==10.3.0",
    "qrcode==7.4.2",
]

[project.optional-dependencies]
dev = ["pytest==7.4.3", "pytest-asyncio==0.21.1", "httpx==0.25.2", "ruff==0.1.6"]

[tool.setuptools]
packages = ["app", "app.core", "app.models", "app.schemas", "app.api", "app.api.routes", "app.services"]

[tool.ruff]
line-length = 120
target-version = "py311"
select = ["E", "W", "F", "I"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
