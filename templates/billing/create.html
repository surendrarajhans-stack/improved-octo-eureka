{% extends "base.html" %}
{% block content %}<div class="glass-card p-4"><h3>Create Invoice</h3><form id="invoiceForm"><div class="row g-2 mb-3"><div class="col-md-4"><input name="patient_id" class="form-control" placeholder="Patient ID" required></div><div class="col-md-4"><input name="visit_type" class="form-control" value="OPD"></div><div class="col-md-4"><input name="discount_amount" class="form-control" value="0"></div></div><label class="form-label">Line Items JSON</label><textarea id="invoiceItems" class="form-control" rows="6">[{"service_type":"CONSULTATION","description":"Consultation Fee","quantity":1,"unit_price":500,"discount":0,"tax_percent":0}]</textarea><div class="text-end mt-3"><button type="button" class="btn btn-primary" onclick="submitInvoice()">Generate Invoice</button></div></form></div>{% endblock %}{% block extra_js %}<script>async function submitInvoice(){const fd=new FormData(document.getElementById('invoiceForm'));fd.append('items',document.getElementById('invoiceItems').value);const res=await fetch('/billing/invoices',{method:'POST',body:fd});const data=await res.json();App.showToast(data.message,'success');if(data.id){window.location=`/billing/invoices/${data.id}`;}}</script>{% endblock %}
