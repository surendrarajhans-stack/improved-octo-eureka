{% extends "base.html" %}
{% block content %}<div class="glass-card p-3"><h3>Attendance Tracker</h3><table class="table"><thead><tr><th>Date</th><th>Employee</th><th>Status</th><th>Hours</th></tr></thead><tbody>{% for record in records %}<tr><td>{{ record.date }}</td><td>{{ record.employee_id }}</td><td>{{ record.status }}</td><td>{{ record.total_hours }}</td></tr>{% else %}<tr><td colspan="4" class="text-center text-muted">No attendance records.</td></tr>{% endfor %}</tbody></table></div>{% endblock %}
