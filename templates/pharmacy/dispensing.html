{% extends "base.html" %}
{% block content %}<div class="glass-card p-3"><h3>Dispense Medicines</h3><form id="dispenseForm"><div class="row g-2"><div class="col-md-3"><input name="patient_id" class="form-control" placeholder="Patient ID" required></div><div class="col-md-3"><input name="payment_mode" class="form-control" value="CASH"></div><div class="col-md-6"><textarea id="dispenseItems" class="form-control" placeholder='[{"medicine_id":1,"quantity":2,"unit_price":15}]' rows="3"></textarea></div></div><div class="text-end mt-3"><button type="button" class="btn btn-primary" onclick="dispenseNow()">Dispense</button></div></form></div>{% endblock %}{% block extra_js %}<script>async function dispenseNow(){const fd=new FormData(document.getElementById('dispenseForm'));fd.append('items',document.getElementById('dispenseItems').value||'[]');const res=await fetch('/pharmacy/dispense',{method:'POST',body:fd});const data=await res.json();App.showToast(data.message,'success');}</script>{% endblock %}
