<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
  <link href="/static/css/style.css" rel="stylesheet">
</head>
<body class="login-page animated-bg">
  <div class="glass-card login-card p-4 p-md-5">
    <div class="text-center mb-4">
      <div class="display-6 text-primary"><i class="fa-solid fa-hospital-user"></i></div>
      <h2 class="fw-bold">{{ hospital.name if hospital else 'City General Hospital' }}</h2>
      <p class="text-muted mb-0">Secure hospital access portal</p>
    </div>
    {% if error %}<div class="alert alert-danger">{{ error }}</div>{% endif %}
    <form method="post" action="/auth/login" class="needs-validation" novalidate>
      <div class="mb-3"><label class="form-label">Username</label><div class="input-group"><span class="input-group-text"><i class="fa-solid fa-user"></i></span><input name="username" class="form-control" required></div></div>
      <div class="mb-3"><label class="form-label">Password</label><div class="input-group"><span class="input-group-text"><i class="fa-solid fa-lock"></i></span><input type="password" name="password" class="form-control" required></div></div>
      <div class="d-flex justify-content-between align-items-center mb-4"><div class="form-check"><input type="checkbox" class="form-check-input" id="remember"><label class="form-check-label" for="remember">Remember me</label></div><span class="text-muted small">admin / admin123</span></div>
      <button class="btn btn-primary w-100 py-2"><i class="fa-solid fa-right-to-bracket me-2"></i>Login</button>
    </form>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/static/js/app.js"></script>
</body>
</html>
