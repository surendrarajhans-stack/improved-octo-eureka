{% extends "base.html" %}
{% block content %}<div class="glass-card p-3"><h3>Ward Layout</h3><div class="row g-3">{% for ward in wards %}<div class="col-lg-4"><div class="glass-card p-3"><h5>{{ ward.name }}</h5><div class="d-flex flex-wrap gap-2">{% for bed in beds if bed.ward_id == ward.id %}<span class="badge {{ 'text-bg-success' if bed.status == 'AVAILABLE' else 'text-bg-danger' if bed.status == 'OCCUPIED' else 'text-bg-warning' }}">{{ bed.bed_number }}</span>{% else %}<span class="text-muted">No beds</span>{% endfor %}</div></div></div>{% endfor %}</div></div>{% endblock %}
